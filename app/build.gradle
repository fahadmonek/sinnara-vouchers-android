plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinnara.vouchers'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sinnara.vouchers'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('sinnara-release.keystore')
            storePassword 'SinnaraVouchers2026'
            keyAlias 'sinnara'
            keyPassword 'SinnaraVouchers2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
