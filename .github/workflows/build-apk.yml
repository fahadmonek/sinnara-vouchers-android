name: Build Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SinnaraVouchers.apk

      - name: Keep APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: SinnaraVouchers-apk
          path: SinnaraVouchers.apk

      - name: Publish as a release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sinnara Vouchers 1.0.${{ github.run_number }}
          files: SinnaraVouchers.apk
